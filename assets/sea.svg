<svg viewBox="0 0 360 300" role="img" aria-labelledby="pt">
        <title id="pt">{title}</title>
        <defs>
          <linearGradient id="sea" x1="0" x2="0" y1="0" y2="1">
            <stop offset="0" stop-color="#BFDCE0"/><stop offset=".55" stop-color="#4D8197"/><stop offset="1" stop-color="#173F55"/>
          </linearGradient>
        </defs>
        <rect x="0" y="40" width="360" height="260" rx="8" fill="url(#sea)"/>
        <path d="M0 40 Q 30 32 60 40 T 120 40 T 180 40 T 240 40 T 300 40 T 360 40" fill="none" stroke="#2C5C4D" stroke-width="1.5"/>
        <!-- surface litter -->
        <g fill="#E3B23C"><rect x="48" y="35" width="9" height="5" rx="1"/><circle cx="140" cy="38" r="3"/><rect x="230" y="34" width="12" height="4" rx="1"/><circle cx="300" cy="39" r="2"/></g>
        <!-- particles -->
        <g fill="#F4E3A8" opacity=".85">
          <circle cx="70" cy="80" r="1.6"/><circle cx="190" cy="96" r="1.4"/><circle cx="260" cy="120" r="1.8"/><circle cx="110" cy="140" r="1.3"/><circle cx="320" cy="160" r="1.5"/><circle cx="40" cy="190" r="1.6"/><circle cx="210" cy="200" r="1.2"/><circle cx="150" cy="230" r="1.5"/>
        </g>
        <!-- fish -->
        <g fill="#0F2633" opacity=".75">
          <path d="M160 120 q 14 -9 28 0 q -14 9 -28 0 z M188 120 l 8 -6 v 12 z"/>
          <path d="M260 175 q 10 -6 20 0 q -10 6 -20 0 z M280 175 l 6 -4 v 8 z"/>
          <path d="M80 110 q 9 -5 18 0 q -9 5 -18 0 z M98 110 l 5 -4 v 8 z"/>
        </g>
        <!-- seafloor -->
        <path d="M0 262 C 40 250 80 270 130 258 S 220 246 260 262 S 330 252 360 258 V 300 H 0 Z" fill="#0F2633"/>
        <!-- posidonia -->
        <g stroke="#5E9E83" stroke-width="2" fill="none" stroke-linecap="round">
          <path d="M30 262 q -4 -22 2 -40"/><path d="M36 262 q 3 -20 -1 -34"/><path d="M42 262 q 6 -18 3 -30"/>
          <path d="M300 258 q -3 -20 2 -36"/><path d="M306 258 q 4 -18 0 -30"/>
        </g>
        <!-- sponge -->
        <path d="M200 256 q -6 -20 6 -22 q 12 2 6 22 z" fill="#C9A24A"/>
        <!-- crab -->
        <g fill="#6FA3C7"><ellipse cx="110" cy="258" rx="9" ry="5"/><path d="M100 255 l -6 -5 M120 255 l 6 -5" stroke="#6FA3C7" stroke-width="2"/></g>
        <!-- labels -->
        <g font-family="IBM Plex Sans, sans-serif" font-size="10.5" fill="#0F2633">
          <text x="8" y="22">{0}</text>
        </g>
        <g font-family="IBM Plex Sans, sans-serif" font-size="10.5" fill="#fff">
          <text x="214" y="88">{1}</text>
          <text x="8" y="166">{2}</text>
          <text x="8" y="292">{3}</text>
        </g>
      </svg>